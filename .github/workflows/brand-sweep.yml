name: brand-sweep

on:
  push:
    branches: [main]
  pull_request:

jobs:
  brand-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Widened to `ios android` as of Task C9: Phase C's Android rebrand
      # (C1-C9) is done, so both platforms are now swept together on every
      # push/PR.
      #
      # continue-on-error stays in place — not a silenced gate, a structural
      # necessity. `android/` alone reports 1500+ hits and always will:
      # Open Decision OD-3 (confirmed by the user 2026-08-31) keeps the
      # Kotlin namespace `com.rarilabs.rarime` unrenamed forever, and the
      # sweep's `rarilabs|rarime` token matches that package/import prefix in
      # essentially every Android source file. There is no future task that
      # closes this the way the iOS entitlements gap can eventually close —
      # `./scripts/brand-sweep.sh android` cannot reach 0 hits while OD-3
      # stands, by design. `ios` alone still separately fails today too (the
      # FoundationMobile/NotificationBackgroundProcessor entitlements'
      # still-Rarimo applinks/App-Group identifiers — Task B2's tracked,
      # not-yet-owned gap) — see scripts/brand-sweep.sh's own EXCLUDES
      # comments for the full breakdown of what's expected-red on each
      # platform and why. A red step here is a real, expected signal on
      # `android` permanently and on `ios` until the entitlements gap closes
      # — don't add a new exemption to either platform's sweep to force
      # green, and don't remove continue-on-error for `android`.
      - name: No residual Rarimo branding
        continue-on-error: true
        run: ./scripts/brand-sweep.sh ios android
      - name: Licensing files present
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f THIRD_PARTY_LICENSES.md
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Rarimo Foundation" NOTICE
      - name: Copyleft inventory is accurate
        run: |
          test -f android/app/src/main/cpp/CMakeLists.txt
          grep -q "librapidsnark.so" android/app/src/main/cpp/CMakeLists.txt
          grep -q "librapidsnark" THIRD_PARTY_LICENSES.md
          grep -q "witnesscalc" THIRD_PARTY_LICENSES.md
      # --exclude-dir=.github is required here: this step's own grep pattern
      # literally contains the string it searches for, so without excluding
      # its own directory this check would permanently fail against itself.
      - name: No inherited live-app identifiers
        run: |
          ! grep -rn "com.foundationglobal.mobile" \
              --exclude-dir=.git --exclude-dir=docs --exclude-dir=.github . || \
            { echo "live bundle id leaked into the fork"; exit 1; }
      - name: No third-party secrets republished
        run: |
          ! grep -rnE 'LIGHT_SIGNATURE_PRIVATE_KEY="[0-9a-f]{16,}"|JOIN_REWARDS_KEY="[0-9a-f]{16,}"' \
              --exclude-dir=.git . || \
            { echo "Rarimo private key present"; exit 1; }
