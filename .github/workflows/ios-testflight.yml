name: iOS TestFlight

# Heavy-pipeline workflow: archive + sign + upload to TestFlight.
#
# ⚠️  THIS COSTS MONEY. It runs on a GitHub-hosted macOS runner (billed
#     ~$0.08/min, and macOS minutes count ~10x against any included quota —
#     a full archive is several dollars to ~$10+ per run). The PREFERRED
#     day-to-day deploy is a FREE local build on the M5 Mac:
#         cd ios && bundle exec fastlane beta
#     or Xcode → Product → Archive → Organizer → Distribute → TestFlight.
#     See docs/ios-deploy.md. This CI exists ONLY as a no-Mac fallback.
#
# Manual-only + guarded against accidental spend:
#   • the `tf-*` tag trigger was removed, so a routine tag push can't
#     silently start a paid run;
#   • workflow_dispatch requires the `confirm` input = `yes-run-paid-ci`.
#     A free ubuntu `confirm-gate` job fails fast otherwise, before any
#     billed macOS runner starts.
#
# Uses fastlane lane `beta` from ios/fastlane/Fastfile (App Store Connect
# API key auth).
#
# Required repo secrets (Settings -> Secrets -> Actions):
#   APP_STORE_CONNECT_API_KEY_KEY_ID       — 10-char key id
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID    — issuer id from ASC
#   APP_STORE_CONNECT_API_KEY_KEY_CONTENT  — full text of the .p8 file
#   IOS_DIST_CERT_P12_BASE64               — base64 of the distribution cert .p12
#   IOS_DIST_CERT_P12_PASSWORD             — password for the .p12
#   IOS_PROVISIONING_PROFILE_BASE64        — base64 of the .mobileprovision
#   KEYCHAIN_PASSWORD                      — random string for the temp keychain
#
# All workflow inputs are constrained (choice / fixed strings) and consumed
# only via env vars in run blocks, never interpolated into shell commands —
# safe against the GitHub Actions injection patterns called out in
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  # Manual dispatch ONLY. The `tf-*` tag trigger was intentionally removed
  # so a routine tag push can't start a paid macOS run by mistake.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm a PAID CI build? (local `bundle exec fastlane beta` is free)'
        type: choice
        required: true
        default: 'no'
        options:
          - 'no'
          - 'yes-run-paid-ci'
      # Intentionally scoped to the 3 security-tier profiles only. Branded
      # editions (moma / tel-aviv / san-francisco / foundation) are
      # demo/local-only for now — they ship via `bundle exec fastlane beta`
      # or a manual Xcode archive, not this paid CI path. Whether to make
      # them CI-shippable is a real decision, deferred to the foundation
      # repo's Phase 5 editions-coherence work (see
      # docs/superpowers/plans/2026-07-03-full-review-remediation-roadmap.md,
      # Phase 5 section, in the foundation repo) — not silently expanded here.
      profile:
        description: 'Foundation security profile'
        type: choice
        required: true
        default: 'hisec-global'
        options:
          - hisec-global
          - standardsec
          - lowsec-attest
      changelog:
        description: 'TestFlight changelog (one line)'
        type: string
        required: false
        default: 'Internal build'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  # Free gate: runs on ubuntu so an accidental dispatch (confirm left at its
  # 'no' default) fails here in seconds WITHOUT ever starting a billed macOS
  # runner. The archive job `needs:` this, so it only proceeds on explicit
  # confirmation.
  confirm-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit paid-build confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "yes-run-paid-ci" ]; then
            echo "::error::TestFlight CI is a PAID macOS run. Set the 'confirm' input to 'yes-run-paid-ci' to proceed, or build for free locally: cd ios && bundle exec fastlane beta"
            exit 1
          fi
          echo "Confirmed — proceeding to the billed archive job."

  archive-and-upload:
    needs: confirm-gate
    # macos-15 ships Xcode 16.x. Firebase 12.x requires Swift 6
    # (`sending`, access-level-on-imports), which Xcode 15.4 on macos-14
    # can't compile.
    runs-on: macos-15
    timeout-minutes: 90

    env:
      FOUNDATION_PROFILE: ${{ inputs.profile || 'hisec-global' }}
      # Hard-fail archives that lack production App Attest entitlement —
      # mirrors the M-H-2 gate in ci_post_clone.sh.
      CI_XCODEBUILD_ACTION: archive

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # ASC requires Xcode 26+ / iOS 26 SDK for uploads. macos-15 has
        # Xcode 26 preinstalled but its `Xcode.app` symlink still points
        # at 16.4 — pick the highest Xcode 26+ explicitly.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_3*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "::error::No Xcode 26+ found — ASC requires it for uploads"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Set up Ruby + bundler cache
        # Gemfile + Gemfile.lock live at repo root, not ios/. Don't pass
        # working-directory or setup-ruby silently no-ops bundler-cache.
        # TF2's lockfile pulls connection_pool 3.0.2 (requires Ruby >= 3.2)
        # and activesupport 7.2.3.1 (requires Ruby >= 3.1). 3.3 covers both
        # comfortably. The lockfile's BUNDLED WITH 4.0.10 / RUBY VERSION
        # 4.0.3 are advisory — bundler falls back to its installed version.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Privacy-grep guard
        run: |
          if [ -f ios/ci_scripts/privacy_grep.sh ]; then
            bash ios/ci_scripts/privacy_grep.sh
          else
            echo "privacy_grep.sh not present on this ref — skipping"
          fi

      - name: Verify Release entitlements declare production App Attest
        # Replicates the ci_post_clone.sh M-H-2 gate. Only fails if the file
        # exists but is wrong — main hasn't adopted FoundationMobile-Release
        # .entitlements yet (it lives on claude/face-matching-design-on-tf2).
        # When absent, the archive uses the default entitlements; gate
        # auto-engages once the project wires Release → Release.entitlements.
        run: |
          REL_ENT=ios/FoundationMobile/FoundationMobile-Release.entitlements
          if [ ! -f "$REL_ENT" ]; then
            echo "::warning::Release entitlements file absent — guard skipped. Archive will use default entitlements."
            exit 0
          fi
          if ! grep -q '<string>production</string>' "$REL_ENT"; then
            echo "::error::Release entitlements does not declare appattest-environment=production"
            exit 1
          fi
          echo "Release entitlements verified at appattest-environment=production"

      - name: Cache Cargo registry + git
        if: hashFiles('mopro-smoke/**') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('mopro-smoke/**/Cargo.lock') }}

      - name: Cache MoproSmoke.xcframework
        if: hashFiles('mopro-smoke/**') != ''
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: mopro-smoke/MoproSmoke.xcframework
          key: xcframework-${{ runner.os }}-${{ hashFiles('mopro-smoke/Cargo.lock', 'mopro-smoke/build-xcframework.sh', 'mopro-smoke/src/**') }}

      - name: Install Rust toolchain
        if: hashFiles('mopro-smoke/**') != '' && steps.cache-xcframework.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Build MoproSmoke.xcframework
        if: hashFiles('mopro-smoke/**') != '' && steps.cache-xcframework.outputs.cache-hit != 'true'
        working-directory: mopro-smoke
        run: ./build-xcframework.sh

      - name: Import code-signing certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/dist.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

      - name: Install fastlane + xcbeautify
        # fastlane is not preinstalled on macos-15 and not in the root Gemfile.
        # xcbeautify formats xcodebuild output to human-readable progress lines.
        run: |
          gem install --no-document fastlane
          brew install xcbeautify

      - name: fastlane beta (archive + upload to TestFlight)
        working-directory: ios
        env:
          FOUNDATION_PROFILE: ${{ env.FOUNDATION_PROFILE }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_CONTENT }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: fastlane beta

      - name: Upload gym build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gym-build-log
          path: ~/Library/Logs/gym/FoundationMobile-FoundationMobile.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload xcarchive as artifact
        # Keep the archive around for 7 days so a failed upload can be
        # re-tried without paying for another build.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FoundationMobile-xcarchive
          path: ios/build/FoundationMobile.xcarchive
          retention-days: 7
          if-no-files-found: ignore
