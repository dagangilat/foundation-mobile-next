name: iOS CI

# Disabled — build and distribute manually via Xcode → Archive → ASC → TestFlight.
# Re-enable the `on:` triggers below when automated CI is needed again.
# The plist injection step (GOOGLE_SERVICE_INFO_PLIST_B64 secret) is already
# wired; SPM replaces the old pod install step.

on:
  workflow_dispatch:  # manual trigger only

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 ships Xcode 16.x. Firebase 12.x requires Swift 6
    # (`sending`, access-level-on-imports), which Xcode 15.4 on macos-14
    # can't compile.
    runs-on: macos-15
    timeout-minutes: 45

    env:
      # Mirrors Xcode Cloud's per-workflow profile selection in ci_post_clone.sh.
      FOUNDATION_PROFILE: hisec-global

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pick the highest Xcode 26+ available — Apple now requires Xcode 26
        # / iOS 26 SDK for ASC uploads (May 2026). macos-15 still defaults
        # to Xcode 16.4 even though Xcode 26 is preinstalled. Fall back to
        # /Applications/Xcode.app for non-distribution simulator builds.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_3*.app 2>/dev/null | sort -V | tail -1)
          LATEST_XCODE=${LATEST_XCODE:-/Applications/Xcode.app}
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Set up Ruby + bundler cache
        # Gemfile + Gemfile.lock live at repo root, not ios/. Don't pass
        # working-directory or setup-ruby silently no-ops bundler-cache.
        # TF2's lockfile pulls connection_pool 3.0.2 (requires Ruby >= 3.2)
        # and activesupport 7.2.3.1 (requires Ruby >= 3.1). 3.3 covers both
        # comfortably. The lockfile's BUNDLED WITH 4.0.10 / RUBY VERSION
        # 4.0.3 are advisory — bundler falls back to its installed version.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Privacy-grep guard
        # Runs first — fails fast on policy violations before any heavy step.
        # Lives only on the face-matching branch today; skip cleanly if absent.
        run: |
          if [ -f ios/ci_scripts/privacy_grep.sh ]; then
            bash ios/ci_scripts/privacy_grep.sh
          else
            echo "privacy_grep.sh not present on this ref — skipping"
          fi

      - name: Inject GoogleService-Info.plist
        # The plist is gitignored (contains live Firebase API key).
        # Add GOOGLE_SERVICE_INFO_PLIST_B64 as a GitHub Actions secret:
        #   base64 -i ios/FoundationMobile/GoogleService-Info.plist | pbcopy
        # then paste in Settings → Secrets → Actions.
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d \
              > ios/FoundationMobile/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected from secret."
          else
            echo "⚠️  GOOGLE_SERVICE_INFO_PLIST_B64 secret not set — using committed file if present."
          fi

      - name: Cache Cargo registry + git
        if: hashFiles('mopro-smoke/**') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('mopro-smoke/**/Cargo.lock') }}

      - name: Cache MoproSmoke.xcframework
        if: hashFiles('mopro-smoke/**') != ''
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: mopro-smoke/MoproSmoke.xcframework
          # Keyed on the Rust sources + build script — rebuild only when they change.
          key: xcframework-${{ runner.os }}-${{ hashFiles('mopro-smoke/Cargo.lock', 'mopro-smoke/build-xcframework.sh', 'mopro-smoke/src/**') }}

      - name: Install Rust toolchain
        if: hashFiles('mopro-smoke/**') != '' && steps.cache-xcframework.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Build MoproSmoke.xcframework
        if: hashFiles('mopro-smoke/**') != '' && steps.cache-xcframework.outputs.cache-hit != 'true'
        working-directory: mopro-smoke
        run: ./build-xcframework.sh

      - name: Build for simulator (no signing)
        working-directory: ios
        env:
          FOUNDATION_PROFILE: ${{ env.FOUNDATION_PROFILE }}
        run: |
          set -o pipefail
          # generic/platform avoids tying us to a specific iPhone model that
          # may not exist on a future runner image (Xcode 15 had iPhone 15,
          # Xcode 16 has iPhone 16, ...). Build doesn't need a concrete device.
          xcodebuild \
            -project FoundationMobile.xcodeproj \
            -scheme FoundationMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            FOUNDATION_PROFILE="$FOUNDATION_PROFILE" \
            build | xcbeautify

      - name: Run unit tests
        # Skip cleanly if no test target wired up yet.
        working-directory: ios
        env:
          FOUNDATION_PROFILE: ${{ env.FOUNDATION_PROFILE }}
        run: |
          set -o pipefail
          if xcodebuild -project FoundationMobile.xcodeproj -list 2>/dev/null | grep -qE 'Test|Tests'; then
            # Tests need a concrete booted simulator — pick the latest iPhone 16
            # on the runner. xcrun simctl list shows what's available if this
            # ever stops resolving on a future image bump.
            xcodebuild \
              -project FoundationMobile.xcodeproj \
              -scheme FoundationMobile \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              FOUNDATION_PROFILE="$FOUNDATION_PROFILE" \
              test | xcbeautify
          else
            echo "no test scheme detected — skipping"
          fi
