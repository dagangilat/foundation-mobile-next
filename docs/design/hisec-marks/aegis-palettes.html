<!DOCTYPE html>
<!-- Aegis mark (chosen) shown as the edition look in 4 palettes (no gold). -->
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;}
  body{background:#05070b;padding:36px;}
  .row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .tile{width:230px;height:300px;border-radius:30px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;box-shadow:0 22px 55px rgba(0,0,0,.55);overflow:hidden;}
  svg{width:108px;height:108px;}
  .wm{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .wm .t{font-size:17px;font-weight:800;letter-spacing:1.5px;}
  .wm .s{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
  .label{color:#fff;font-size:14px;font-weight:700;}
  .sub{color:#7e8696;font-size:11px;text-align:center;}
</style></head>
<body>
<div class="row">

  <!-- 1 — Steel + Electric Blue -->
  <div class="col">
    <div class="tile" style="background:#0a1320">
      <svg viewBox="0 0 100 100" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path style="stroke:#38bdf8" d="M50 7 L85 19 V49 C85 72 70 87 50 94 C30 87 15 72 15 49 V19 Z"/>
        <circle style="stroke:#7dd3fc" cx="50" cy="49" r="20" stroke-width="2.4"/>
        <ellipse style="stroke:#7dd3fc" cx="50" cy="49" rx="8" ry="20" stroke-width="2.4"/>
        <path style="stroke:#7dd3fc" d="M31 42 H69 M31 56 H69" stroke-width="2.4"/>
      </svg>
      <div class="wm"><div class="t" style="color:#eaf2fb">FOUNDATION</div><div class="s" style="color:#38bdf8">High Security · Global</div></div>
    </div>
    <div class="label">Steel + Electric Blue</div>
    <div class="sub">global · secure-tech</div>
  </div>

  <!-- 2 — Arctic Light -->
  <div class="col">
    <div class="tile" style="background:#f4f7fb">
      <svg viewBox="0 0 100 100" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path style="stroke:#0a1426" d="M50 7 L85 19 V49 C85 72 70 87 50 94 C30 87 15 72 15 49 V19 Z"/>
        <circle style="stroke:#2563eb" cx="50" cy="49" r="20" stroke-width="2.4"/>
        <ellipse style="stroke:#2563eb" cx="50" cy="49" rx="8" ry="20" stroke-width="2.4"/>
        <path style="stroke:#2563eb" d="M31 42 H69 M31 56 H69" stroke-width="2.4"/>
      </svg>
      <div class="wm"><div class="t" style="color:#0a1426">FOUNDATION</div><div class="s" style="color:#2563eb">High Security · Global</div></div>
    </div>
    <div class="label">Arctic Light</div>
    <div class="sub">clean · institutional</div>
  </div>

  <!-- 3 — Sentinel Green -->
  <div class="col">
    <div class="tile" style="background:#08110d">
      <svg viewBox="0 0 100 100" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path style="stroke:#2ee6a6" d="M50 7 L85 19 V49 C85 72 70 87 50 94 C30 87 15 72 15 49 V19 Z"/>
        <circle style="stroke:#34d399" cx="50" cy="49" r="20" stroke-width="2.4"/>
        <ellipse style="stroke:#34d399" cx="50" cy="49" rx="8" ry="20" stroke-width="2.4"/>
        <path style="stroke:#34d399" d="M31 42 H69 M31 56 H69" stroke-width="2.4"/>
      </svg>
      <div class="wm"><div class="t" style="color:#f0fdf7">FOUNDATION</div><div class="s" style="color:#2ee6a6">High Security · Global</div></div>
    </div>
    <div class="label">Sentinel Green</div>
    <div class="sub">darker, sharper Foundation</div>
  </div>

  <!-- 4 — Platinum Obsidian (no gold) -->
  <div class="col">
    <div class="tile" style="background:#0b0d12">
      <svg viewBox="0 0 100 100" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path style="stroke:#dfe4ea" d="M50 7 L85 19 V49 C85 72 70 87 50 94 C30 87 15 72 15 49 V19 Z"/>
        <circle style="stroke:#8aa0bd" cx="50" cy="49" r="20" stroke-width="2.4"/>
        <ellipse style="stroke:#8aa0bd" cx="50" cy="49" rx="8" ry="20" stroke-width="2.4"/>
        <path style="stroke:#8aa0bd" d="M31 42 H69 M31 56 H69" stroke-width="2.4"/>
      </svg>
      <div class="wm"><div class="t" style="color:#f5f6f8">FOUNDATION</div><div class="s" style="color:#c7ced9">High Security · Global</div></div>
    </div>
    <div class="label">Platinum Obsidian</div>
    <div class="sub">premium · no gold</div>
  </div>

</div>
</body></html>
