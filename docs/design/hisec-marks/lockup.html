<!DOCTYPE html>
<!-- Aegis + FOUNDATION lockup — the shared logo for in-app BrandLockup AND the
     launch screen. Steel/electric-blue palette. Rendered transparent. -->
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;}
  #lockup{display:inline-flex;align-items:center;gap:22px;padding:10px 14px;background:transparent;}
  #lockup svg{width:96px;height:96px;display:block;}
  #lockup .wm{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
    font-weight:800;font-size:62px;letter-spacing:1.5px;line-height:1;white-space:nowrap;}
  #lockup .wm .a{color:#eaf2fb;}
  #lockup .wm .b{color:#38bdf8;}
</style></head>
<body>
<div id="lockup">
  <svg viewBox="0 0 100 100" fill="none" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <path style="stroke:#38bdf8" d="M50 7 L85 19 V49 C85 72 70 87 50 94 C30 87 15 72 15 49 V19 Z"/>
    <circle style="stroke:#7dd3fc" cx="50" cy="49" r="20" stroke-width="2.6"/>
    <ellipse style="stroke:#7dd3fc" cx="50" cy="49" rx="8" ry="20" stroke-width="2.6"/>
    <path style="stroke:#7dd3fc" d="M31 42 H69 M31 56 H69" stroke-width="2.6"/>
  </svg>
  <span class="wm"><span class="a">FOUND</span><span class="b">ATION</span></span>
</div>
</body></html>
